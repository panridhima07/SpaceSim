<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#101c30" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <title>Moon Landing · Space Flight Builder</title>
    <style>
      /* Restyled to match the ASTRA SPACEFLIGHT reference (astra-spaceflight/css/style.css):
         flat dark glass panels, no 3D tilt, a top bar, flat keys, cyan accent. */
      @property --sfb-px { syntax: '<number>'; inherits: false; initial-value: 0; }
      @property --sfb-py { syntax: '<number>'; inherits: false; initial-value: 0; }
      :root { color-scheme: dark;
        --ink: #dbe9ff; --dim: #7f93b2; --line: rgba(150, 195, 255, 0.16); --glass: rgba(6, 11, 20, 0.68);
        --acc: #7fd7ff; --acc2: #ffb454; --ok: #7dffb2; --bad: #ff5d6c;
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --ease-in: cubic-bezier(0.7, 0, 0.84, 0); }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #02040a; color: var(--ink);
        font: 13px/1.4 "Inter", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
        -webkit-font-smoothing: antialiased; }
      #view { position: fixed; inset: 0; }
      #view canvas { display: block; touch-action: none; }
      @keyframes in-left { from { opacity: 0; translate: -28px 0; } }
      @keyframes in-right { from { opacity: 0; translate: 28px 0; } }
      @keyframes rise { from { opacity: 0; translate: 0 18px; } }
      @keyframes pop { from { opacity: 0; scale: 0.95; } }
      /* Flat glass panel, as in the reference .panel. */
      .panel { position: fixed; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
        background: var(--glass);
        backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
        box-shadow: 0 14px 50px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05); }
      .panel.slim { padding: 8px 10px; }

      /* Top bar (reference #top / .brand). */
      #brand { position: fixed; top: 0; left: 0; right: 0; border: 0; border-radius: 0; box-shadow: none;
        backdrop-filter: none; -webkit-backdrop-filter: none;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0));
        padding: 12px 16px; display: flex; flex-direction: row; align-items: center; gap: 14px;
        animation: in-left 360ms var(--ease-out) backwards; }
      #brand b { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 400;
        letter-spacing: 0.28em; text-transform: uppercase; color: var(--acc); }
      #brand b strong { color: #fff; font-weight: 700; }
      #brand b .wide { color: var(--dim); }
      #brand b svg { filter: drop-shadow(0 0 8px rgba(127, 215, 255, 0.6)); }
      #brand .chip { padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 11px;
        letter-spacing: 0.2em; text-transform: uppercase; color: var(--acc);
        background: rgba(10, 20, 36, 0.5); white-space: nowrap; }
      #brand a.btn { margin-left: auto; }

      /* Flight HUD, top right. */
      #hud { top: 62px; right: 14px; width: 264px; padding: 14px;
        animation: in-right 360ms var(--ease-out) backwards; }
      #hud .phase { font-size: 15px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
        color: #fff; text-shadow: 0 0 14px rgba(127, 215, 255, 0.6); }
      #hud .site { color: var(--acc); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
        margin: 2px 0 8px; min-height: 1.4em; }
      #hud table { width: 100%; border-collapse: collapse; }
      #hud td { padding: 2px 0; }
      #hud td:first-child { color: var(--dim); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; }
      #hud td:last-child { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums;
        font-weight: 500; color: #fff; }
      .bar { height: 6px; border-radius: 99px; background: rgba(255, 255, 255, 0.08); overflow: hidden; margin: 3px 0 7px; }
      .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #3aa8ff, #7fd7ff);
        transition: width 0.35s cubic-bezier(0.2, 0.7, 0.2, 1); }

      /* Event log, bottom left. */
      #log { left: 14px; bottom: 84px; width: 310px; max-height: 148px; overflow: hidden; font-size: 12px;
        animation: in-left 360ms var(--ease-out) 60ms backwards; }
      #log:empty { display: none; }
      #log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #c5d2e6; padding: 1px 0; }
      #log div:first-child { animation: rise 220ms var(--ease-out) backwards; }
      #log .ok { color: var(--ok); } #log .am { color: var(--acc2); } #log .bad { color: var(--bad); }

      /* Dock, bottom centre (reference #ctrl). */
      #dock { left: 0; right: 0; bottom: 12px; margin: 0 auto; width: fit-content; display: flex; flex-wrap: wrap;
        gap: 8px; justify-content: center; max-width: min(780px, calc(100vw - 24px)); border-radius: 14px;
        padding: 8px 10px;
        animation: rise 380ms var(--ease-out) 120ms backwards; }

      /* Flat keys. */
      button, a.btn { font: inherit; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
        color: var(--ink); text-decoration: none; cursor: pointer; min-height: 0; padding: 8px 12px;
        display: inline-flex; align-items: center; justify-content: center;
        background: rgba(18, 30, 52, 0.55); border: 1px solid var(--line); border-radius: 10px;
        transition: background 0.18s, border-color 0.18s, transform 0.12s; }
      button:hover:not(:disabled), a.btn:hover { background: rgba(40, 70, 120, 0.5); border-color: rgba(127, 215, 255, 0.5); }
      button:active:not(:disabled), a.btn:active { transform: scale(0.97); }
      button:focus-visible, a.btn:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
      button.on { background: rgba(127, 215, 255, 0.16); border-color: #7fd7ff; color: #7fd7ff; }
      button.on:hover:not(:disabled) { background: rgba(127, 215, 255, 0.22); }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      #help { color: var(--dim); font-size: 11px; letter-spacing: 0.04em; margin-top: 2px; }

      /* Result: centred flat panel (reference #modal > div). */
      #result { top: 96px; left: 0; right: 0; margin: 0 auto; width: min(400px, calc(100vw - 40px));
        text-align: center; padding: 26px 28px; display: none; animation: pop 320ms var(--ease-out) backwards; }
      #result h2 { margin: 0 0 6px; font-size: 28px; font-weight: 300; letter-spacing: 0.18em; text-transform: uppercase;
        color: #fff; text-shadow: 0 0 30px rgba(127, 215, 255, 0.5); }
      #result p { margin: 6px 0 16px; color: var(--dim); font-size: 13px; line-height: 1.6; }
      #result button:first-of-type { background: linear-gradient(180deg, rgba(127, 215, 255, 0.95), rgba(70, 160, 230, 0.95));
        color: #031018; font-weight: 700; border-color: transparent; box-shadow: 0 0 24px rgba(127, 215, 255, 0.35); }
      #result button:first-of-type:hover:not(:disabled) { filter: brightness(1.08); }

      /* Busy: centred pill chip. */
      #busy { top: 50%; left: 0; right: 0; margin: 0 auto; width: fit-content; translate: 0 -50%;
        padding: 8px 18px; border-radius: 999px; box-shadow: none; background: rgba(10, 20, 36, 0.5);
        font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--acc); }

      @media (max-width: 640px) {
        .panel { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgba(8, 13, 24, 0.92); }
        /* Phone: the top bar keeps the brand and the builder link; the HUD sits below it. */
        #brand { padding: calc(8px + env(safe-area-inset-top)) 10px 8px; gap: 8px; }
        #brand .wide, #brand .chip { display: none; }
        #brand b { letter-spacing: 0.2em; }
        #hud { top: calc(68px + env(safe-area-inset-top)); right: 10px; width: min(204px, calc(100vw - 20px));
          padding: 10px 12px; font-size: 12px; }
        #hud .phase { font-size: 12px; letter-spacing: 0.16em; }
        #hud .site { font-size: 9px; letter-spacing: 0.1em; margin-bottom: 6px; }
        #hud td:first-child { font-size: 9px; letter-spacing: 0.12em; }
        #hud td:last-child { white-space: nowrap; padding-left: 6px; }
        #log, #help { display: none; }
        /* Dock becomes one swipeable row. */
        #dock { bottom: max(10px, env(safe-area-inset-bottom)); width: auto; max-width: none; margin: 0 10px;
          flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scrollbar-width: none;
          padding: 8px 10px; border-radius: 14px; }
        #dock::-webkit-scrollbar { display: none; }
        #dock button { flex: none; }
        #result { top: auto; bottom: 96px; }
        button, a.btn { min-height: 44px; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation-duration: 0.01ms !important; animation-delay: 0s !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="brand" class="panel">
      <b><svg viewBox="0 0 32 32" width="20" height="20" aria-hidden="true"><path d="M16 3l6 17-6-3.6L10 20z" fill="currentColor"/><path d="M9 24h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><strong>Astra</strong><span class="wide">Moon Landing</span></b>
      <span class="chip">Moon landing</span>
      <a class="btn" href="./index.html">←&nbsp;<span class="wide">Rocket&nbsp;</span>Builder</a>
    </div>
    <div id="hud" class="panel"></div>
    <div id="log" class="panel"></div>
    <div id="dock" class="panel"></div>
    <div id="result" class="panel"></div>
    <div id="busy" class="panel">Computing the descent orbit…</div>
    <script type="module" src="/src/landing/main.ts"></script>
  </body>
</html>
