<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#101c30" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <title>Moon Landing · Space Flight Builder</title>
    <style>
      /* Restyled to match the ASTRA SPACEFLIGHT reference and .sfb-root token system:
         flat dark glass panels, no 3D tilt, a top bar, flat keys, cyan accent. */
      @property --sfb-px { syntax: '<number>'; inherits: false; initial-value: 0; }
      @property --sfb-py { syntax: '<number>'; inherits: false; initial-value: 0; }
      :root,
      .sfb-root {
        color-scheme: dark;
        --sfb-panel: rgba(6, 11, 20, 0.68);
        --sfb-line: rgba(150, 195, 255, 0.16);
        --sfb-text: #dbe9ff;
        --sfb-muted: #7f93b2;
        --sfb-accent: #7fd7ff;
        --sfb-accent2: #ffb454;
        --sfb-critical: #ff5d6c;
        --sfb-warning: #ffb454;
        --sfb-info: #7fd7ff;
        --sfb-good: #7dffb2;
        --sfb-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        --sfb-ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --sfb-ease-in: cubic-bezier(0.7, 0, 0.84, 0);
        --sfb-ease-move: cubic-bezier(0.65, 0, 0.35, 1);
        --sfb-slab:
          0 14px 50px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        /* Legacy aliases kept for backwards compatibility */
        --ink: var(--sfb-text);
        --dim: var(--sfb-muted);
        --line: var(--sfb-line);
        --glass: var(--sfb-panel);
        --acc: var(--sfb-accent);
        --acc2: var(--sfb-accent2);
        --ok: var(--sfb-good);
        --bad: var(--sfb-critical);
        --mono: var(--sfb-mono);
        --ease-out: var(--sfb-ease-out);
        --ease-in: var(--sfb-ease-in);
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #02040a;
        color: var(--sfb-text);
        font: 400 13px/1.35 "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      #view { position: fixed; inset: 0; }
      #view canvas { display: block; touch-action: none; }
      @keyframes in-left { from { opacity: 0; translate: -28px 0; } }
      @keyframes in-right { from { opacity: 0; translate: 28px 0; } }
      @keyframes rise { from { opacity: 0; translate: 0 18px; } }
      @keyframes pop { from { opacity: 0; scale: 0.95; } }

      /* Flat glass panel (.sfb-panel). */
      .panel,
      .sfb-panel {
        position: fixed;
        border: 1px solid var(--sfb-line);
        border-radius: 14px;
        padding: 12px 14px;
        background: var(--sfb-panel);
        backdrop-filter: blur(18px) saturate(1.4);
        -webkit-backdrop-filter: blur(18px) saturate(1.4);
        box-shadow: var(--sfb-slab);
      }
      .panel.slim,
      .sfb-panel.slim { padding: 8px 10px; }

      /* Top bar (reference #top / .sfb-brand). */
      #brand {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 58px;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0));
        padding: 12px 16px;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 14px;
        pointer-events: none;
        animation: in-left 360ms var(--sfb-ease-out) backwards;
      }
      #brand > * { pointer-events: auto; }
      #brand b {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--sfb-muted);
        white-space: nowrap;
      }
      #brand b strong { color: #fff; font-weight: 700; }
      #brand b .wide { color: var(--sfb-muted); }
      #brand b svg {
        flex: none;
        color: var(--sfb-accent);
        filter: drop-shadow(0 0 8px rgba(127, 215, 255, 0.6));
      }
      #brand .chip {
        padding: 5px 12px;
        border: 1px solid var(--sfb-line);
        border-radius: 999px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--sfb-accent);
        background: rgba(10, 20, 36, 0.5);
        white-space: nowrap;
      }
      #brand a.btn { margin-left: auto; }

      /* Flight HUD, top right. */
      #hud {
        top: 62px;
        right: 14px;
        width: 264px;
        padding: 14px;
        animation: in-right 360ms var(--sfb-ease-out) backwards;
      }
      #hud .phase {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #fff;
        text-shadow: 0 0 14px rgba(127, 215, 255, 0.6);
      }
      #hud .site {
        color: var(--sfb-accent);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin: 2px 0 8px;
        min-height: 1.4em;
      }
      #hud table { width: 100%; border-collapse: collapse; }
      #hud td { padding: 2px 0; }
      #hud td:first-child {
        color: var(--sfb-muted);
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      #hud td:last-child {
        text-align: right;
        font-family: var(--sfb-mono);
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        font-weight: 500;
        color: #fff;
      }
      #hud td.ok { color: var(--sfb-good); }
      #hud td.am { color: var(--sfb-warning); }
      #hud td.bad { color: var(--sfb-critical); }
      .bar {
        height: 6px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        margin: 3px 0 7px;
      }
      .bar i {
        display: block;
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, #3aa8ff, var(--sfb-accent));
        transition: width 0.35s cubic-bezier(0.2, 0.7, 0.2, 1);
      }

      /* Event log, bottom left. */
      #log {
        left: 14px;
        bottom: 84px;
        width: 310px;
        max-height: 148px;
        overflow: hidden;
        font-size: 12px;
        animation: in-left 360ms var(--sfb-ease-out) 60ms backwards;
      }
      #log:empty { display: none; }
      #log div {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--sfb-text);
        padding: 1px 0;
      }
      #log div:first-child { animation: rise 220ms var(--sfb-ease-out) backwards; }
      #log .info { color: var(--sfb-info); }
      #log .ok { color: var(--sfb-good); }
      #log .am { color: var(--sfb-warning); }
      #log .bad { color: var(--sfb-critical); }

      /* Dock, bottom centre (reference #ctrl / .sfb-dock). */
      #dock {
        left: 0;
        right: 0;
        bottom: 12px;
        margin: 0 auto;
        width: fit-content;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        justify-content: center;
        max-width: min(780px, calc(100vw - 24px));
        border-radius: 14px;
        padding: 8px 10px;
        animation: rise 380ms var(--sfb-ease-out) 120ms backwards;
      }

      /* Flat keys (.sfb-btn). Scoped so auth-chip buttons keep their own rules. */
      .sfb-btn,
      a.btn,
      #dock button,
      #result button {
        appearance: none;
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--sfb-text);
        text-decoration: none;
        cursor: pointer;
        min-height: 34px;
        padding: 8px 12px;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(18, 30, 52, 0.55);
        border: 1px solid var(--sfb-line);
        border-radius: 10px;
        box-shadow: none;
        transition: background 0.18s, border-color 0.18s, transform 0.12s, filter 0.18s, box-shadow 0.18s;
      }
      @media (hover: hover) {
        .sfb-btn:hover:not(:disabled),
        a.btn:hover,
        #dock button:hover:not(:disabled),
        #result button:hover:not(:disabled) {
          background: rgba(40, 70, 120, 0.5);
          border-color: rgba(127, 215, 255, 0.5);
        }
      }
      .sfb-btn:active:not(:disabled),
      a.btn:active,
      #dock button:active:not(:disabled),
      #result button:active:not(:disabled) {
        transform: scale(0.97);
      }
      .sfb-btn:focus-visible,
      a.btn:focus-visible,
      #dock button:focus-visible,
      #result button:focus-visible {
        outline: 2px solid var(--sfb-accent);
        outline-offset: 2px;
      }
      .sfb-btn.on,
      .sfb-btn.is-active,
      #dock button.on,
      #dock button.is-active {
        background: rgba(127, 215, 255, 0.16);
        border-color: var(--sfb-accent);
        color: var(--sfb-accent);
      }
      @media (hover: hover) {
        .sfb-btn.on:hover:not(:disabled),
        .sfb-btn.is-active:hover:not(:disabled),
        #dock button.on:hover:not(:disabled),
        #dock button.is-active:hover:not(:disabled) {
          background: rgba(127, 215, 255, 0.22);
          border-color: var(--sfb-accent);
        }
      }
      .sfb-btn:disabled,
      #dock button:disabled,
      #result button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #help {
        color: var(--sfb-muted);
        font-size: 11px;
        letter-spacing: 0.04em;
        margin-top: 2px;
      }

      /* Result: centred flat panel (reference #modal > div). */
      #result {
        top: 96px;
        left: 0;
        right: 0;
        margin: 0 auto;
        width: min(400px, calc(100vw - 40px));
        text-align: center;
        padding: 26px 28px;
        display: none;
        animation: pop 320ms var(--sfb-ease-out) backwards;
      }
      #result h2 {
        margin: 0 0 6px;
        font-size: 28px;
        font-weight: 300;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #fff;
        text-shadow: 0 0 30px rgba(127, 215, 255, 0.5);
      }
      #result p {
        margin: 6px 0 16px;
        color: var(--sfb-muted);
        font-size: 13px;
        line-height: 1.6;
      }
      #result button:first-of-type,
      .sfb-btn-primary {
        background: linear-gradient(180deg, rgba(127, 215, 255, 0.95), rgba(70, 160, 230, 0.95));
        color: #031018;
        font-weight: 700;
        border-color: transparent;
        box-shadow: 0 0 24px rgba(127, 215, 255, 0.35);
      }
      @media (hover: hover) {
        #result button:first-of-type:hover:not(:disabled),
        .sfb-btn-primary:hover:not(:disabled) {
          background: linear-gradient(180deg, rgba(127, 215, 255, 0.95), rgba(70, 160, 230, 0.95));
          border-color: transparent;
          filter: brightness(1.08);
          box-shadow: 0 0 36px rgba(127, 215, 255, 0.6);
        }
      }

      /* Busy: centred pill chip. */
      #busy {
        top: 50%;
        left: 0;
        right: 0;
        margin: 0 auto;
        width: fit-content;
        translate: 0 -50%;
        padding: 8px 18px;
        border-radius: 999px;
        box-shadow: none;
        background: rgba(10, 20, 36, 0.5);
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--sfb-accent);
      }

      @media (max-width: 760px) {
        :root,
        .sfb-root {
          --sfb-panel: rgba(8, 13, 24, 0.92);
        }
        .panel,
        .sfb-panel {
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
          background: var(--sfb-panel);
        }
        /* Phone: the top bar keeps the brand and the builder link; the HUD sits below it. */
        #brand {
          height: auto;
          background: linear-gradient(180deg, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0));
          padding: calc(8px + env(safe-area-inset-top, 0px)) 10px 8px;
          gap: 8px;
        }
        #brand .wide, #brand .chip { display: none; }
        #brand b { letter-spacing: 0.2em; }
        #hud {
          top: calc(68px + env(safe-area-inset-top, 0px));
          right: 10px;
          width: min(204px, calc(100vw - 20px));
          padding: 10px 12px;
          font-size: 12px;
        }
        #hud .phase { font-size: 12px; letter-spacing: 0.16em; }
        #hud .site { font-size: 9px; letter-spacing: 0.12em; margin-bottom: 6px; }
        #hud td:first-child { font-size: 9px; letter-spacing: 0.12em; }
        #hud td:last-child { font-size: 12px; white-space: nowrap; padding-left: 6px; }
        #log, #help { display: none; }
        /* Dock becomes one swipeable row with >= 44x44px touch targets. */
        #dock {
          bottom: max(10px, env(safe-area-inset-bottom, 0px));
          width: auto;
          max-width: none;
          margin: 0 10px;
          flex-wrap: nowrap;
          justify-content: flex-start;
          overflow-x: auto;
          scrollbar-width: none;
          padding: 8px 10px;
          border-radius: 14px;
        }
        #dock::-webkit-scrollbar { display: none; }
        #dock button { flex: none; }
        #result { top: auto; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
        .sfb-btn,
        a.btn,
        #dock button,
        #result button {
          min-height: 44px;
          min-width: 44px;
          touch-action: manipulation;
        }
        /* Keep the account chip in the clear top-left zone below #brand and >= 44x44px on mobile. */
        .auth-chip {
          left: calc(10px + env(safe-area-inset-left, 0px));
          top: calc(68px + env(safe-area-inset-top, 0px));
          bottom: auto;
        }
        .auth-chip-toggle {
          width: 44px;
          height: 44px;
          min-width: 44px;
          min-height: 44px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-delay: 0s !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body class="sfb-root">
    <div id="view"></div>
    <div id="brand" class="panel sfb-panel">
      <b><svg viewBox="0 0 32 32" width="20" height="20" aria-hidden="true"><path d="M16 3l6 17-6-3.6L10 20z" fill="currentColor"/><path d="M9 24h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><strong>Astra</strong><span class="wide">Moon Landing</span></b>
      <span class="chip">Moon landing</span>
      <a class="btn sfb-btn" href="./index.html">←&nbsp;<span class="wide">Rocket&nbsp;</span>Builder</a>
    </div>
    <div id="hud" class="panel sfb-panel"></div>
    <div id="log" class="panel sfb-panel"></div>
    <div id="dock" class="panel sfb-panel"></div>
    <div id="result" class="panel sfb-panel"></div>
    <div id="busy" class="panel sfb-panel">Computing the descent orbit…</div>
    <script type="module" src="/src/landing/boot.ts"></script>
  </body>
</html>
