<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Fly Chandrayaan-3 from lunar orbit to a soft landing near the Moon's south pole, in your browser." />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <title>Chandrayaan-3 to the Moon · ASTRA Spaceflight</title>
    <style>
      /* Restyled to match the ASTRA SPACEFLIGHT reference and .sfb-root token system:
         flat dark glass panels, no 3D tilt, a top bar, flat keys, amber accent. */
      @property --sfb-px { syntax: '<number>'; inherits: false; initial-value: 0; }
      @property --sfb-py { syntax: '<number>'; inherits: false; initial-value: 0; }
      :root,
      .sfb-root {
        color-scheme: dark;
        --sfb-panel: rgba(14, 14, 16, 0.68);
        --sfb-line: rgba(255, 255, 255, 0.08);
        --sfb-text: #ededee;
        --sfb-muted: #8a8a90;
        --sfb-accent: #f5a65b;
        --sfb-accent2: #5fc4b8;
        --sfb-critical: #ff5d6c;
        --sfb-warning: #ffd166;
        --sfb-info: #5fc4b8;
        --sfb-good: #7dffb2;
        --sfb-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        --sfb-ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --sfb-ease-in: cubic-bezier(0.7, 0, 0.84, 0);
        --sfb-ease-move: cubic-bezier(0.65, 0, 0.35, 1);
        --sfb-slab: 0 14px 50px rgba(0, 0, 0, 0.45);
        /* Legacy aliases kept for backwards compatibility */
        --ink: var(--sfb-text);
        --dim: var(--sfb-muted);
        --line: var(--sfb-line);
        --glass: var(--sfb-panel);
        --acc: var(--sfb-accent);
        --acc2: var(--sfb-accent2);
        --ok: var(--sfb-good);
        --bad: var(--sfb-critical);
        --mono: var(--sfb-mono);
        --ease-out: var(--sfb-ease-out);
        --ease-in: var(--sfb-ease-in);
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0a0b;
        color: var(--sfb-text);
        font: 400 13px/1.35 "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      input[type="range"] { accent-color: var(--sfb-accent); }
      #view { position: fixed; inset: 0; }
      /* H or the dock button clears the readouts off the view. Leaving is quicker than arriving. */
      #hud, #log {
        transition: opacity 240ms var(--sfb-ease-out), translate 240ms var(--sfb-ease-out), visibility 0s;
      }
      body.hud-off #hud, body.hud-off #log {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        translate: 12px 0;
        transition: opacity 150ms var(--sfb-ease-in), translate 150ms var(--sfb-ease-in), visibility 0s 150ms;
      }
      #view canvas { display: block; touch-action: none; }
      @keyframes in-left { from { opacity: 0; translate: -14px 0; } }
      @keyframes in-right { from { opacity: 0; translate: 14px 0; } }
      @keyframes rise { from { opacity: 0; translate: 0 18px; } }
      @keyframes pop { from { opacity: 0; scale: 0.95; } }

      /* Flat glass panel (.sfb-panel). */
      .panel,
      .sfb-panel {
        position: fixed;
        border: 1px solid var(--sfb-line);
        border-radius: 10px;
        padding: 12px 14px;
        background: var(--sfb-panel);
        backdrop-filter: blur(18px) saturate(1.4);
        -webkit-backdrop-filter: blur(18px) saturate(1.4);
        box-shadow: var(--sfb-slab);
      }
      .panel.slim,
      .sfb-panel.slim { padding: 8px 10px; }

      /* Top bar (reference #top / .sfb-brand). */
      #brand {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 58px;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0));
        padding: 12px 16px;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 14px;
        pointer-events: none;
        animation: in-left 360ms var(--sfb-ease-out) backwards;
      }
      #brand > * { pointer-events: auto; }
      #brand b {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--sfb-muted);
        white-space: nowrap;
      }
      #brand b strong { color: #fff; font-weight: 700; }
      #brand b .wide { color: var(--sfb-muted); }
      #brand b svg {
        flex: none;
        color: var(--sfb-accent);
        filter: none;
      }
      #brand .chip {
        padding: 5px 12px;
        border: 1px solid var(--sfb-line);
        border-radius: 999px;
        font-family: var(--sfb-mono);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--sfb-accent);
        background: rgba(20, 20, 23, 0.5);
        white-space: nowrap;
      }
      #brand a.btn { margin-left: auto; }

      /* Flight HUD, top right. */
      #hud {
        top: 62px;
        right: 14px;
        width: 264px;
        padding: 14px;
        animation: in-right 360ms var(--sfb-ease-out) backwards;
      }
      #hud .phase {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #fff;
        text-shadow: none;
      }
      #hud .site {
        color: var(--sfb-muted);
        font-family: var(--sfb-mono);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin: 2px 0 8px;
        min-height: 1.4em;
      }
      #hud table { width: 100%; border-collapse: collapse; }
      #hud td { padding: 2px 0; }
      #hud td:first-child {
        color: var(--sfb-muted);
        font-family: var(--sfb-mono);
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      #hud td:last-child {
        text-align: right;
        font-family: var(--sfb-mono);
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        font-weight: 500;
        color: #fff;
      }
      #hud td.ok { color: var(--sfb-good); }
      #hud td.am { color: var(--sfb-warning); }
      #hud td.bad { color: var(--sfb-critical); }
      .bar {
        height: 6px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        margin: 3px 0 7px;
      }
      .bar i {
        display: block;
        height: 100%;
        border-radius: 99px;
        background: var(--sfb-accent);
        transition: width 240ms var(--sfb-ease-out);
      }

      /* Event log, bottom left. */
      #log {
        left: 14px;
        bottom: 84px;
        width: 310px;
        max-height: 148px;
        overflow: hidden;
        font-size: 12px;
        animation: in-left 360ms var(--sfb-ease-out) 60ms backwards;
      }
      #log:empty { display: none; }
      #log div {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--sfb-text);
        padding: 1px 0;
      }
      #log div:first-child { animation: rise 220ms var(--sfb-ease-out) backwards; }
      #log .info { color: var(--sfb-info); }
      #log .ok { color: var(--sfb-good); }
      #log .am { color: var(--sfb-warning); }
      #log .bad { color: var(--sfb-critical); }

      /* Dock, bottom centre (reference #ctrl / .sfb-dock). */
      #dock {
        left: 0;
        right: 0;
        bottom: 12px;
        margin: 0 auto;
        width: fit-content;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        justify-content: center;
        max-width: min(780px, calc(100vw - 24px));
        border-radius: 10px;
        padding: 8px 10px;
        animation: rise 380ms var(--sfb-ease-out) 120ms backwards;
      }

      /* Flat keys (.sfb-btn). Scoped so auth-chip buttons keep their own rules. */
      .sfb-btn,
      a.btn,
      #dock button,
      #result button {
        appearance: none;
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--sfb-text);
        text-decoration: none;
        cursor: pointer;
        min-height: 34px;
        padding: 8px 12px;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--sfb-line);
        border-radius: 8px;
        box-shadow: none;
        transition: background 150ms var(--sfb-ease-out), border-color 150ms var(--sfb-ease-out), transform 120ms var(--sfb-ease-out), filter 150ms var(--sfb-ease-out), box-shadow 150ms var(--sfb-ease-out);
      }
      @media (hover: hover) {
        .sfb-btn:hover:not(:disabled),
        a.btn:hover,
        #dock button:hover:not(:disabled),
        #result button:hover:not(:disabled) {
          background: rgba(255, 255, 255, 0.08);
          border-color: rgba(255, 255, 255, 0.16);
        }
      }
      .sfb-btn:active:not(:disabled),
      a.btn:active,
      #dock button:active:not(:disabled),
      #result button:active:not(:disabled) {
        transform: scale(0.97);
      }
      .sfb-btn:focus-visible,
      a.btn:focus-visible,
      #dock button:focus-visible,
      #result button:focus-visible {
        outline: 2px solid var(--sfb-accent);
        outline-offset: 2px;
      }
      .sfb-btn.on,
      .sfb-btn.is-active,
      #dock button.on,
      #dock button.is-active {
        background: rgba(245, 166, 91, 0.12);
        border-color: var(--sfb-accent);
        color: var(--sfb-accent);
      }
      @media (hover: hover) {
        .sfb-btn.on:hover:not(:disabled),
        .sfb-btn.is-active:hover:not(:disabled),
        #dock button.on:hover:not(:disabled),
        #dock button.is-active:hover:not(:disabled) {
          background: rgba(245, 166, 91, 0.16);
          border-color: var(--sfb-accent);
        }
      }
      .sfb-btn:disabled,
      #dock button:disabled,
      #result button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #help {
        color: var(--sfb-muted);
        font-size: 11px;
        letter-spacing: 0.04em;
        margin-top: 2px;
      }

      /* Result: centred flat panel (reference #modal > div). */
      #result {
        top: 96px;
        left: 0;
        right: 0;
        margin: 0 auto;
        width: min(400px, calc(100vw - 40px));
        text-align: center;
        padding: 26px 28px;
        display: none;
        animation: pop 320ms var(--sfb-ease-out) backwards;
      }
      #result h2 {
        margin: 0 0 6px;
        font-size: 28px;
        font-weight: 300;
        letter-spacing: -0.01em;
        text-transform: uppercase;
        color: #ededee;
        text-shadow: none;
      }
      #result p {
        margin: 6px 0 16px;
        color: var(--sfb-muted);
        font-size: 13px;
        line-height: 1.6;
      }
      #result button:first-of-type,
      .sfb-btn-primary {
        background: #f4f4f2;
        color: #0a0a0b;
        font-weight: 600;
        border-color: transparent;
        box-shadow: none;
      }
      @media (hover: hover) {
        #result button:first-of-type:hover:not(:disabled),
        .sfb-btn-primary:hover:not(:disabled) {
          background: #fff;
          border-color: transparent;
          filter: none;
          box-shadow: none;
        }
      }

      /* Busy: centred pill chip. */
      #busy {
        top: 50%;
        left: 0;
        right: 0;
        margin: 0 auto;
        width: fit-content;
        translate: 0 -50%;
        padding: 8px 18px;
        border-radius: 999px;
        box-shadow: none;
        background: rgba(20, 20, 23, 0.5);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--sfb-accent);
      }

      @media (max-width: 760px) {
        :root,
        .sfb-root {
          --sfb-panel: rgba(14, 14, 16, 0.92);
        }
        .panel,
        .sfb-panel {
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
          background: var(--sfb-panel);
        }
        /* Phone: the top bar keeps the brand and the builder link; the HUD sits below it. */
        #brand {
          height: auto;
          background: linear-gradient(180deg, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0));
          padding: calc(8px + env(safe-area-inset-top, 0px)) 10px 8px;
          gap: 8px;
        }
        #brand .wide, #brand .chip { display: none; }
        #brand b { letter-spacing: 0.14em; }
        #hud {
          top: calc(68px + env(safe-area-inset-top, 0px));
          right: 10px;
          width: min(204px, calc(100vw - 20px));
          padding: 10px 12px;
          font-size: 12px;
        }
        #hud .phase { font-size: 12px; letter-spacing: 0.16em; }
        #hud .site { font-size: 9px; letter-spacing: 0.12em; margin-bottom: 6px; }
        #hud td:first-child { font-size: 9px; letter-spacing: 0.12em; }
        #hud td:last-child { font-size: 12px; white-space: nowrap; padding-left: 6px; }
        #log, #help { display: none; }
        /* Dock becomes one swipeable row with >= 44x44px touch targets. */
        #dock {
          bottom: max(10px, env(safe-area-inset-bottom, 0px));
          width: auto;
          max-width: none;
          margin: 0 10px;
          flex-wrap: nowrap;
          justify-content: flex-start;
          overflow-x: auto;
          scrollbar-width: none;
          padding: 8px 10px;
          border-radius: 10px;
        }
        #dock::-webkit-scrollbar { display: none; }
        #dock button { flex: none; }
        #result { top: auto; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
        .sfb-btn,
        a.btn,
        #dock button,
        #result button {
          min-height: 44px;
          min-width: 44px;
          touch-action: manipulation;
        }
        /* Keep the account chip in the clear top-left zone below #brand and >= 44x44px on mobile. */
        .auth-chip {
          left: calc(10px + env(safe-area-inset-left, 0px));
          top: calc(68px + env(safe-area-inset-top, 0px));
          bottom: auto;
        }
        .auth-chip-toggle {
          width: 44px;
          height: 44px;
          min-width: 44px;
          min-height: 44px;
        }
      }

      /* Powered descent: the flight deck (flightDeck.css) covers the view. These offsets keep it
         clear of the top bar, dock and HUD; it adds its own 8px and the safe-area insets.
         --dock-h is measured in main.ts. */
      body.deck-on {
        --fdk-top: 54px;
        --fdk-bottom: calc(var(--dock-h, 84px) + 12px);
        --fdk-left: 56px; /* clear of the account button */
        --fdk-right: 278px; /* the HUD column */
      }
      body.deck-on.hud-off { --fdk-right: 6px; }
      body.deck-on #hud {
        max-height: calc(100% - var(--dock-h, 84px) - 86px);
        overflow-y: auto;
      }
      /* The log moves right of the throttle lever. */
      body.deck-on #log {
        left: 150px;
        bottom: calc(var(--dock-h, 84px) + 24px);
        width: min(310px, calc(100vw - 660px));
      }
      @media (max-width: 900px) {
        body.deck-on #log { display: none; }
      }
      /* Phones: the deck's readouts stand in for the HUD. */
      @media (max-width: 760px), (max-height: 500px) {
        body.deck-on,
        body.deck-on.hud-off {
          --fdk-left: 0px;
          --fdk-right: 0px;
        }
        body.deck-on #hud,
        body.deck-on #log,
        body.deck-on .auth-chip { display: none; }
      }
      @media (max-width: 760px) {
        body.deck-on {
          --fdk-top: 52px;
          --fdk-bottom: calc(var(--dock-h, 62px) + 8px);
        }
      }
      /* Phone in landscape: the dock becomes one swipeable row between the lever and the arrows,
         and the deck's top bar sits between the brand and the builder link. */
      @media (max-height: 500px) {
        body.deck-on {
          --fdk-top: 0px;
          --fdk-bottom: 0px;
        }
        body.deck-on #brand {
          height: auto;
          padding: calc(8px + env(safe-area-inset-top, 0px)) 10px 0;
        }
        body.deck-on #brand .wide,
        body.deck-on #brand .chip { display: none; }
        body.deck-on .fdk .fdk-top { max-width: calc(100% - 220px); }
        body.deck-on #dock {
          left: calc(92px + env(safe-area-inset-left, 0px));
          right: calc(156px + env(safe-area-inset-right, 0px));
          bottom: max(4px, env(safe-area-inset-bottom, 0px));
          width: auto;
          max-width: none;
          margin: 0;
          flex-wrap: nowrap;
          justify-content: flex-start;
          overflow-x: auto;
          scrollbar-width: none;
          padding: 4px 8px;
        }
        body.deck-on #dock button { flex: none; min-height: 44px; }
        body.deck-on #help { display: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-delay: 0s !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body class="sfb-root">
    <div id="view"></div>
    <div id="brand" class="panel sfb-panel">
      <b><svg viewBox="0 0 32 32" width="20" height="20" aria-hidden="true"><path d="M16 3l6 17-6-3.6L10 20z" fill="currentColor"/><path d="M9 24h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><strong>Astra</strong><span class="wide">Chandrayaan-3</span></b>
      <span class="chip" id="chip">Journey to the Moon</span>
      <a class="btn sfb-btn" href="./index.html">←&nbsp;<span class="wide">Rocket&nbsp;</span>Builder</a>
    </div>
    <div id="hud" class="panel sfb-panel"></div>
    <div id="log" class="panel sfb-panel"></div>
    <div id="dock" class="panel sfb-panel"></div>
    <div id="result" class="panel sfb-panel"></div>
    <div id="busy" class="panel sfb-panel">Flying Chandrayaan-3 from Earth orbit to the Moon…</div>
    <script type="module" src="/src/landing/boot.ts"></script>
  </body>
</html>
