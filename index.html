<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta property="og:title" content="ASTRA Spaceflight" />

    <meta property="og:image" content="https://astra-spaceflight.vercel.app/icon-512.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />

    <title>ASTRA Spaceflight · Rocket builder and flight simulator</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/boot.ts"></script>
    <script>
      // Offline cache for the website. Skipped in dev and inside the Android app,
      // which already serves its files locally.
      if ('serviceWorker' in navigator && !window.Capacitor && location.hostname !== 'localhost') {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
      }
    </script>
  </body>
</html>
