<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Part designs · Space Flight Builder</title>
    <style>
      :root {
        color-scheme: dark;
        --sfb-panel: rgba(6, 11, 20, 0.68);
        --sfb-line: rgba(150, 195, 255, 0.16);
        --sfb-text: #dbe9ff;
        --sfb-muted: #7f93b2;
        --sfb-accent: #7fd7ff;
        --sfb-good: #7dffb2;
        --sfb-warning: #ffb454;
        --sfb-critical: #ff5d6c;
        --sfb-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        --sfb-slab: 0 14px 50px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        --ink: var(--sfb-text);
        --dim: var(--sfb-muted);
        --line: var(--sfb-line);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 20px 24px 40px;
        background: #060b14;
        color: var(--sfb-text);
        font: 13px/1.5 "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      h1 { font-size: 18px; margin: 0 0 4px; letter-spacing: 0.08em; text-wrap: balance; }
      p.lead { margin: 0 0 18px; color: var(--sfb-muted); max-width: 70ch; }
      table { border-collapse: collapse; width: 100%; max-width: 1100px; }
      th {
        text-align: left;
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        padding: 6px 10px;
        color: var(--sfb-muted);
      }
      th.best { color: var(--sfb-good); }
      th.ok { color: var(--sfb-warning); }
      th.bad { color: var(--sfb-critical); }
      td { padding: 6px 10px; border-top: 1px solid var(--sfb-line); vertical-align: middle; }
      td.kind { font-weight: 600; white-space: nowrap; }
      .cell { display: flex; align-items: center; gap: 10px; }
      .cell img {
        width: 220px;
        height: 150px;
        border-radius: 10px;
        border: 1px solid var(--sfb-line);
        background: var(--sfb-panel);
        box-shadow: var(--sfb-slab);
        display: block;
      }
      .cell .icon { width: 48px; height: 48px; flex: none; color: var(--sfb-text); }
      .cell .icon svg { width: 100%; height: 100%; display: block; }
      .cell .icon.small { width: 24px; height: 24px; }
    </style>
  </head>
  <body>
    <h1>Part designs: best, OK and bad</h1>
    <p class="lead">Every part is drawn here at the same dimensions in its three build-quality designs, with the 2D icon at 48 px and 24 px. An imported rocket uses the design its grade selects.</p>
    <table id="grid"></table>
    <script type="module" src="/src/gallery/main.ts"></script>
  </body>
</html>
