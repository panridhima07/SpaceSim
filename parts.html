<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Part designs · Space Flight Builder</title>
    <style>
      :root { color-scheme: dark; --ink: #dbe9ff; --dim: #7f93b2; --line: rgba(150, 195, 255, 0.16); }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px 24px 40px; background: #060b14; color: var(--ink);
        font: 13px/1.5 system-ui, "Segoe UI", sans-serif; }
      h1 { font-size: 18px; margin: 0 0 4px; text-wrap: balance; }
      p.lead { margin: 0 0 18px; color: var(--dim); max-width: 70ch; }
      table { border-collapse: collapse; width: 100%; max-width: 1100px; }
      th { text-align: left; font-weight: 600; padding: 6px 10px; color: var(--dim); }
      th.best { color: #3ddc97; } th.ok { color: #f2b84b; } th.bad { color: #ef5350; }
      td { padding: 6px 10px; border-top: 1px solid var(--line); vertical-align: middle; }
      td.kind { font-weight: 600; white-space: nowrap; }
      .cell { display: flex; align-items: center; gap: 10px; }
      .cell img { width: 220px; height: 150px; border-radius: 8px; background: #0d1522; display: block; }
      .cell .icon { width: 48px; height: 48px; flex: none; color: var(--ink); }
      .cell .icon svg { width: 100%; height: 100%; display: block; }
      .cell .icon.small { width: 24px; height: 24px; }
    </style>
  </head>
  <body>
    <h1>Part designs: best, OK and bad</h1>
    <p class="lead">Every part is drawn here at the same dimensions in its three build-quality designs, with the 2D icon at 48 px and 24 px. An imported rocket uses the design its grade selects.</p>
    <table id="grid"></table>
    <script type="module" src="/src/gallery/main.ts"></script>
  </body>
</html>
