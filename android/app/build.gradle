apply plugin: 'com.android.application'

// One version for the website and the app: "version" in the root package.json.
// 1.2.3 becomes versionName "1.2.3" and versionCode 10203 (Google Play needs the code to go up
// with every upload, so bump the version before each release).
def appVersionName = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version as String
def appVersionParts = (appVersionName.tokenize('-+')[0].tokenize('.') + ['0', '0', '0']).take(3).collect { it as int }
def appVersionCode = appVersionParts[0] * 10000 + appVersionParts[1] * 100 + appVersionParts[2]

// Release signing key: android/keystore.properties (not in git; see docs/MOBILE-RELEASE.md).
// Without it, debug builds still work and release builds stop with a message.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
// keytool makes a PKCS12 keystore, where the key has the same password as the file, so
// keyPassword may be left out, or left as the placeholder from the example file.
def ownKeyPassword = keystoreProps['keyPassword']
def signingKeyPassword = (!ownKeyPassword || ownKeyPassword == 'YOUR-KEYSTORE-PASSWORD')
        ? keystoreProps['storePassword'] : ownKeyPassword

android {
    namespace = "com.astra.spaceflightbuilder"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.astra.spaceflightbuilder"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Only set the signing fields when every key is present; otherwise warn and leave them unset.
            def requiredSigningValues = [
                storeFile    : keystoreProps['storeFile'],
                storePassword: keystoreProps['storePassword'],
                keyAlias     : keystoreProps['keyAlias'],
                keyPassword  : signingKeyPassword
            ]
            def missingSigningKeys = requiredSigningValues.findAll { k, v -> !v }.keySet().toList()
            if (keystorePropsFile.exists() && missingSigningKeys.isEmpty()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword signingKeyPassword
            } else if (keystorePropsFile.exists()) {
                logger.warn("keystore.properties is missing: ${missingSigningKeys.join(', ')}")
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        // Google Play: the release build plus src/play/AndroidManifest.xml, which removes the
        // permission to install APKs and marks the app as a Play build.
        play {
            initWith release
            matchingFallbacks = ['release']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// An unsigned release APK cannot be installed, so fail early with the fix.
gradle.taskGraph.whenReady { graph ->
    if (!keystorePropsFile.exists() && graph.allTasks.any { it.project == project && it.name ==~ /(assemble|bundle|package)(Release|Play)/ }) {
        throw new GradleException('Release builds need android/keystore.properties. See docs/MOBILE-RELEASE.md, "Signing key".')
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
